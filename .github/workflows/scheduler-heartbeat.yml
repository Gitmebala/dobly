name: Scheduler heartbeat

# vercel.json only defines one daily cron job (Vercel Hobby's limit), which
# only ever checks operator loops/watchers once a day - so a loop configured
# as "hourly" or "always_on" (see the cadence options in
# src/app/dashboard/workflows/page.tsx) can never actually run at that
# cadence no matter how correct the due-loop math in
# src/lib/runtime/scheduler.ts is. This workflow is a free, external
# heartbeat that hits the same endpoint every 15 minutes so those cadences
# are honest, without needing a paid Vercel plan.
#
# One-time setup required (cannot be done from code): add a repo secret
# named DOBLY_CRON_SECRET in GitHub → Settings → Secrets and variables →
# Actions, with the same value as CRON_SECRET in the Vercel deployment's
# environment variables. Until that secret exists, this workflow's requests
# will get a 401 from /api/cron/process-queue and do nothing harmful - the
# route itself never trusts a missing/wrong secret.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger the scheduler pass
        env:
          DOBLY_CRON_SECRET: ${{ secrets.DOBLY_CRON_SECRET }}
        run: |
          if [ -z "$DOBLY_CRON_SECRET" ]; then
            # Exit 0 so forks and PRs are not marked broken, but make the
            # no-op impossible to mistake for a working heartbeat. This step
            # used to exit silently green, so a repo whose secret was never
            # added showed hundreds of "successful" runs while no scheduled
            # loop had ever actually fired.
            echo "::warning title=Heartbeat inactive::DOBLY_CRON_SECRET is not set, so no scheduler pass ran. Add it in Settings > Secrets and variables > Actions."
            {
              echo "### Scheduler heartbeat: INACTIVE"
              echo ""
              echo "\`DOBLY_CRON_SECRET\` is not set, so this run did **not** trigger a scheduler pass."
              echo "Scheduled loops and watchers are not running on their configured cadence."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer $DOBLY_CRON_SECRET" \
            "${{ vars.DOBLY_APP_URL || 'https://dobly-dev.vercel.app' }}/api/cron/process-queue")
          echo "Response status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "::error title=Scheduler pass failed::/api/cron/process-queue returned $status"
            echo "### Scheduler heartbeat: FAILED ($status)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### Scheduler heartbeat: ok ($status)" >> "$GITHUB_STEP_SUMMARY"
